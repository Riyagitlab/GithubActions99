name: my workflow
# To get trigger on every push in my repo in any branch
on:  
  push:    
jobs:
  job1:
   name: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: step-1
       run: |
         pwd
         ls -ltr
         hostname
     - name: checkout
       uses: actions/checkout@v6.0.2
     - name: step-3
       run: |
           echo 'pwd' >> myartifact.txt
           ls -ltr
           hostname
     - name: upload single file
       uses:  actions/upload-artifact@v4
       with:
          name: single file
          path: ./myartifact.txt
           
        
     

  
