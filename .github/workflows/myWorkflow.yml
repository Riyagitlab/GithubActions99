name: my workflow
# To get trigger on every push in my repo in any branch
on:  
  push:    
jobs:
  job1:
   name: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: step-1
       run: |
         pwd
         ls -ltr
         hostname
     - name: checkout
       uses: actions/checkout@v6.0.2
     - name: step-3
       run: |
           echo 'pwd' >> myartifact.txt
           mkdir artifacts
           echo 'ls -ltr' >> artifacts/list.txt
           echo 'hostname' >> artifacts/hostname.txt          
     - name: upload single file
       uses:  actions/upload-artifact@v7.0.0
       with:
          name: single file
          path: ./myartifact.txt
     - name: upload from directory
       uses: actions/upload-artifact@v7.0.0
       with:
          name: directory_artifacts
          path: artifacts/
     - name: upload from multiple/paths
       uses: actions/upload-artifact@v7.0.0
       with:
         name: multiple_paths
         path: |
            ./myartifact.txt
            artifacts/
     - name: upload from multiple/paths with exclusions
       uses: actions/upload-artifact@v7.0.0
       with:
         name: multiple_paths_with_exclusions
         path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt
  job2:
   name: JOB2
   needs: job1
   runs-on: ubuntu-latest
   steps:
     - name: checking current directory
       run: |
         pwd
         ls -ltr
     - name: Download single file Artifact
       uses: actions/download-artifact@v7.0.0
       with:
         name: single file
     - name: checking current directory post download
       run: |
         pwd
         ls -ltr

  job3:
   name: JOB3
   needs: job1
   runs-on: ubuntu-latest
   steps:
     - name: checking current directory
       run: |
         pwd
         ls -ltr
     - name: Download directory
       uses: actions/download-artifact@v7.0.0
       with:
         name: directory_artifacts
     - name: checking current directory post download
       run: |
         pwd
         ls -ltr      

  job4:
   name: JOB4
   needs: job1
   runs-on: ubuntu-latest
   steps:
     - name: creating custom folder for directories
       run: |
          mkdir -p single_file
          mkdir -p download_directory
     - name: checking current directory
       run: |
         pwd
         ls -ltr
     - name: Download single file Artifact
       uses: actions/download-artifact@v7.0.0
       with:
         name: single file
         path: single_file         
     - name: Download directory
       uses: actions/download-artifact@v7.0.0
       with: 
         name: directory_artifacts
         path: download_directory
     - name: checking current directory post download
       run: |
         pwd
         echo "CHECKING SINGLE FILE DIRECTORY"
         ls -ltr single_file
         echo "checking directory artifact"
         ls -ltr download_directory
        
     

  
