name: my workflow
# To get trigger on every push in my repo in any branch
on: push

jobs:
  job1:
   name: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: Running single command in job1
       run: echo "Hello"
     - name: Checking OS Release for GitHub Hosted Runner
       run: cat /etc/os-release
     - name: calling sleep
       run: sleep 20

  job2:
   name: JOB2
   runs-on: ubuntu-latest
   steps:
     - name: checking the hostname for runner
       run: hostname
     - name: Running multiple commands
       run: |
          echo "Hi this is the place to learn"
          echo "Have a Great learning"
          sleep 20

  job3:
    name: JOB3
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: job with single dependency
        run: sleep 10

  job4:
    name: JOB4
    needs: [job1, job2, job3]
    runs-on: ubuntu-latest
    steps:
      - name: Job for multiple dependencies
        run: sleep 10
       
  
