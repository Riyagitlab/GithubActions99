name: my workflow
# To get trigger on every push in my repo in any branch
on:  
  push:    
   branches:
      - main
  pull_request:
    branches:
      - main     
env:
    ENV_TYPE: Dev
    APP_USER: lav
    APP_PORT: 80
jobs:
  job1:
   name: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: step-1
       run: |
         pwd
         ls -ltr
         hostname
     - name: checkout
       uses: actions/checkout@v6.0.2
     - name: step-3
       run: |
           echo 'pwd' >> myartifact.txt
           mkdir artifacts
           echo 'ls -ltr' >> artifacts/list.txt
           echo 'hostname' >> artifacts/hostname.txt          
     - name: upload single file
       uses:  actions/upload-artifact@v7.0.0
       with:
          name: single file
          path: ./myartifact.txt   
   
  job2:
   name: JOB2
   needs: job1
   runs-on: ubuntu-latest
   steps:
     - name: checking current directory
       run: |
         pwd
         ls -ltr
     - name: Download single file Artifact
       uses: actions/download-artifact@v7.0.0
       with:
         name: single file
     - name: Referring Environment variables
       run: |
        echo "[INFO} Running Deployment for $ENV_TYPE with user $APP_USER. "
        echo "Once deployed application is accessible on port $APP_PORT."
     - name: Referring Environment secret
       run: |
         echo "{INFO] Application password is ${{secrets.APP_PASSWORD}}"

        
     

  
